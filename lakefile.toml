name = "DHSafe"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DHSafe"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "DHSafe"

[[lean_exe]]
name = "dhsafe"
root = "Main"
